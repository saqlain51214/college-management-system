---
deployment:
  tasks:
    - export DEPLOYPATH=/home/jinnahde/jdca_app/
    - export PUBLICPATH=/home/jinnahde/public_html/
    # Sync the app code (everything except what's server-specific or gitignored)
    - /bin/rsync -avc --exclude='.env' --exclude='storage' --exclude='vendor' --exclude='node_modules' --exclude='.git' --exclude='public/build' $PWD/ $DEPLOYPATH
    # Sync the public/ folder's non-build files into the real web root (index.php, .htaccess, etc.) — build/ is left alone, it's uploaded separately via FTP
    - /bin/rsync -avc --exclude='build' $PWD/public/ $PUBLICPATH
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan migrate --force
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan config:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan view:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan route:clear
    # Filament caches its panel/resource/widget discovery — without clearing this,
    # newly added or removed admin modules don't show up until the next unrelated
    # cache bust, which is confusing after every deploy.
    - /bin/rm -rf $DEPLOYPATH/bootstrap/cache/filament
    # Best-effort front-end asset rebuild — only runs if Node/npm is available
    # on this hosting plan. Fully guarded: if npm is missing, or "npm ci"/
    # "npm run build" fails partway, this silently does nothing and never
    # touches the existing public_html/build — the manual FTP upload of
    # public/build after each style change keeps working exactly as before.
    - >
      (command -v npm >/dev/null 2>&1 &&
      cd $DEPLOYPATH &&
      npm ci &&
      npm run build &&
      /bin/rm -rf $PUBLICPATH/build &&
      /bin/cp -r $DEPLOYPATH/public/build $PUBLICPATH/build &&
      echo "Front-end assets rebuilt and deployed automatically.") ||
      echo "Skipped auto asset build (npm unavailable or build failed) — upload public/build via FTP manually as before."
