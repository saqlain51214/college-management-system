---
deployment:
  tasks:
    - export DEPLOYPATH=/home/jinnahde/jdca_app/
    - export PUBLICPATH=/home/jinnahde/public_html/
    # Sync the app code (everything except what's server-specific or gitignored)
    - /bin/rsync -av --exclude='.env' --exclude='storage' --exclude='vendor' --exclude='node_modules' --exclude='.git' --exclude='public/build' $PWD/ $DEPLOYPATH
    # Sync the public/ folder's non-build files into the real web root (index.php, .htaccess, etc.) — build/ is left alone, it's uploaded separately via FTP
    - /bin/rsync -av --exclude='build' $PWD/public/ $PUBLICPATH
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan migrate --force
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan config:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan view:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php $DEPLOYPATH/artisan route:clear
